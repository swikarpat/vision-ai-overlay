<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 840" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Photon & Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="photon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <style>
    .node-box {
      rx: 12px;
      stroke-width: 1.5px;
      transition: all 0.3s ease;
    }
    .label-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Display", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .label-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Text", sans-serif;
      font-size: 11.5px;
      fill: #94A3B8;
    }
    .flow-label {
      font-family: "SF Mono", Menlo, Monaco, "Courier New", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 0.3px;
    }
    .data-wire {
      stroke: #334155;
      stroke-width: 2px;
      stroke-dasharray: 4, 4;
      animation: wireDash 1.2s linear infinite;
    }
    @keyframes wireDash {
      to { stroke-dashoffset: -8; }
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="860" height="840" fill="url(#bg-radial)" rx="16" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="140" x2="860" y2="140" />
    <line x1="0" y1="280" x2="860" y2="280" />
    <line x1="0" y1="430" x2="860" y2="430" />
    <line x1="0" y1="580" x2="860" y2="580" />
    <line x1="0" y1="720" x2="860" y2="720" />
    <line x1="215" y1="0" x2="215" y2="840" />
    <line x1="430" y1="0" x2="430" y2="840" />
    <line x1="645" y1="0" x2="645" y2="840" />
  </g>

  <!-- ==================== CONNECTOR PATHS ==================== -->
  <path id="path1" d="M 430 105 L 430 185" class="data-wire" marker-end="url(#arrow)" />
  <path id="path2" d="M 430 260 L 430 340" class="data-wire" marker-end="url(#arrow)" />
  <path id="path3" d="M 430 425 L 430 505" class="data-wire" marker-end="url(#arrow)" />
  <path id="path4" d="M 430 580 L 430 660" class="data-wire" marker-end="url(#arrow)" />

  <!-- Data Flow Payload Tags -->
  <g>
    <rect x="445" y="133" width="220" height="24" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="455" y="149" class="flow-label">Raw Display Frame Buffer</text>

    <rect x="445" y="288" width="180" height="24" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="455" y="304" class="flow-label" fill="#60A5FA">Native CGImage Stream</text>

    <rect x="445" y="453" width="235" height="24" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="455" y="469" class="flow-label" fill="#C084FC">Raw Unstructured Text</text>

    <rect x="445" y="608" width="245" height="24" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="455" y="624" class="flow-label" fill="#34D399">Structured Semantic Payload</text>
  </g>

  <!-- ==================== FLOWING PHOTONS ==================== -->
  <!-- Stream 1 Photons -->
  <circle r="4.5" fill="#38BDF8" filter="url(#photon-glow)">
    <animateMotion path="M 430 105 L 430 185" dur="1.1s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#E0F2FE" filter="url(#photon-glow)">
    <animateMotion path="M 430 105 L 430 185" dur="1.1s" begin="0.55s" repeatCount="indefinite" />
  </circle>

  <!-- Stream 2 Photons -->
  <circle r="4.5" fill="#60A5FA" filter="url(#photon-glow)">
    <animateMotion path="M 430 260 L 430 340" dur="1.1s" begin="0.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#DBEAFE" filter="url(#photon-glow)">
    <animateMotion path="M 430 260 L 430 340" dur="1.1s" begin="0.75s" repeatCount="indefinite" />
  </circle>

  <!-- Stream 3 Photons -->
  <circle r="4.5" fill="#C084FC" filter="url(#photon-glow)">
    <animateMotion path="M 430 425 L 430 505" dur="1.1s" begin="0.4s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#F3E8FF" filter="url(#photon-glow)">
    <animateMotion path="M 430 425 L 430 505" dur="1.1s" begin="0.95s" repeatCount="indefinite" />
  </circle>

  <!-- Stream 4 Photons -->
  <circle r="4.5" fill="#34D399" filter="url(#photon-glow)">
    <animateMotion path="M 430 580 L 430 660" dur="1.1s" begin="0.1s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#D1FAE5" filter="url(#photon-glow)">
    <animateMotion path="M 430 580 L 430 660" dur="1.1s" begin="0.65s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== MODULE NODES ==================== -->

  <!-- Node 1: macOS WindowServer -->
  <g transform="translate(130, 30)">
    <rect width="600" height="75" fill="#0B1329" stroke="#38BDF8" stroke-opacity="0.8" class="node-box" filter="url(#glow-cyan)">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.2;2;1.2" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <!-- Status LED -->
    <circle cx="30" cy="38" r="4.5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="50" y="34" fill="#F8FAFC" class="label-title">macOS WindowServer</text>
    <text x="50" y="53" class="label-sub">GPU Hardware Compositor Layer • Isolated Surface (<tspan fill="#38BDF8" font-family="monospace">sharingType = .none</tspan>)</text>
  </g>

  <!-- Node 2: ScreenCaptureKit -->
  <g transform="translate(130, 185)">
    <rect width="600" height="75" fill="#0B1533" stroke="#60A5FA" stroke-opacity="0.8" class="node-box" filter="url(#glow-blue)">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="2.7s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.2;2;1.2" dur="2.7s" begin="0.5s" repeatCount="indefinite" />
    </rect>
    <!-- Status LED -->
    <circle cx="30" cy="38" r="4.5" fill="#60A5FA">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="50" y="34" fill="#F8FAFC" class="label-title">ScreenCaptureKit Engine</text>
    <text x="50" y="53" class="label-sub">Direct Display Ingestion • Real-Time PID &amp; Window Exclusion Filtering</text>
  </g>

  <!-- Node 3: Apple Vision Framework -->
  <g transform="translate(130, 340)">
    <rect width="600" height="85" fill="#140E2E" stroke="#A855F7" stroke-opacity="0.8" class="node-box" filter="url(#glow-purple)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.2;2.2;1.2" dur="2.2s" begin="0.8s" repeatCount="indefinite" />
    </rect>
    <!-- Status LED -->
    <circle cx="30" cy="43" r="4.5" fill="#C084FC">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="50" y="34" fill="#F8FAFC" class="label-title">Apple Vision Framework (ANE Accelerated)</text>
    <text x="50" y="53" class="label-sub">Offline Neural Character Recognition • Transformer/CNN Spatial Transcription</text>
    <text x="50" y="69" class="label-sub" fill="#C084FC">⚡ Sub-100ms Inference Window on Apple Silicon Neural Engine</text>
  </g>

  <!-- Node 4: Deduplication & Stitch Engine -->
  <g transform="translate(130, 505)">
    <rect width="600" height="75" fill="#1C140A" stroke="#F59E0B" stroke-opacity="0.8" class="node-box" filter="url(#glow-amber)">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.2;2;1.2" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
    </rect>
    <!-- Status LED -->
    <circle cx="30" cy="38" r="4.5" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="50" y="34" fill="#F8FAFC" class="label-title">Deduplication &amp; Stitching Engine</text>
    <text x="50" y="53" class="label-sub">Suffix-Prefix Boundary Overlap Matching • Seamless Scroll Reconciliation</text>
  </g>

  <!-- Node 5: WebKit & Multimodal LLM -->
  <g transform="translate(130, 660)">
    <rect width="600" height="75" fill="#061A16" stroke="#10B981" stroke-opacity="0.8" class="node-box" filter="url(#glow-emerald)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.1s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1.2;2.2;1.2" dur="2.1s" begin="0.6s" repeatCount="indefinite" />
    </rect>
    <!-- Status LED -->
    <circle cx="30" cy="38" r="4.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="50" y="34" fill="#F8FAFC" class="label-title">WebKit Runtime &amp; Generative LLM</text>
    <text x="50" y="53" class="label-sub">Silent DOM Injection Payload • Multimodal Algorithmic Solution Synthesis</text>
  </g>
</svg>
