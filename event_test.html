<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Keyboard Telemetry Diagnostic</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", monospace;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      margin: 0;
    }
    h2 { margin-top: 0; font-size: 18px; color: #38bdf8; }
    textarea {
      width: 100%;
      height: 70px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      padding: 10px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    textarea:focus { border-color: #38bdf8; }
    .controls {
      margin: 12px 0;
      display: flex;
      gap: 10px;
    }
    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #475569; }
    #log {
      width: 100%;
      height: 380px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      font-size: 12px;
      box-sizing: border-box;
    }
    .entry {
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
      display: flex;
      gap: 16px;
    }
    .entry.keydown { color: #4ade80; }
    .entry.keyup { color: #f472b6; }
    .entry.input { color: #facc15; }
    .timestamp { color: #64748b; min-width: 65px; }
  </style>
</head>
<body>
  <h2>DOM Keyboard Event Sniffer</h2>
  <textarea id="editor" placeholder="Focus here and press Option + O..."></textarea>
  <div class="controls">
    <button onclick="clearLogs()">Clear Log</button>
    <span style="font-size: 12px; color: #94a3b8; align-self: center;">
      Monitors exact keydown, keyup, and character input events as HackerRank would see them.
    </span>
  </div>
  <div id="log"></div>

  <script>
    const logBox = document.getElementById('log');
    const editor = document.getElementById('editor');

    function logEvent(type, details, cssClass) {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const div = document.createElement('div');
      div.className = `entry ${cssClass}`;
      div.innerHTML = `<span class="timestamp">${timeStr}</span> <strong>[${type}]</strong> <span>${details}</span>`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    ['keydown', 'keyup'].forEach(eventType => {
      window.addEventListener(eventType, (e) => {
        const details = `key: "${e.key}" | code: "${e.code}" | keyCode: ${e.keyCode} | altKey: ${e.altKey} | metaKey: ${e.metaKey}`;
        logEvent(eventType, details, eventType);
      }, true);
    });

    editor.addEventListener('input', (e) => {
      logEvent('input', `data: "${e.data || ''}" | inputType: ${e.inputType}`, 'input');
    });

    function clearLogs() {
      logBox.innerHTML = '';
      editor.value = '';
    }
  </script>
</body>
</html>
